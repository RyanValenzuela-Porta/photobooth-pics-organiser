<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Photobooth Customs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="gallery-header">
            <nav class="nav-links">
                <a href="index.html" class="nav-link">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    Per Person
                </a>
                <span class="nav-divider">|</span>
                <a href="gallery.html" class="nav-link active">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    Gallery
                </a>
            </nav>
            <h1>All Photos Gallery</h1>
            <p class="subtitle">Browse all <span id="totalImages">0</span> photos</p>
        </header>
        
        <div class="gallery-toolbar">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by person name..." 
                    autocomplete="off"
                >
                <span id="resultCount" class="result-count"></span>
            </div>
            <div class="toolbar-actions">
                <button id="downloadAllBtn" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                    </svg>
                    Download All as ZIP
                </button>
            </div>
        </div>
        
        <main id="galleryGrid" class="gallery-grid">
            <!-- Images will be dynamically inserted here -->
        </main>
        
        <footer>
            <p>Total: <span id="totalImagesFooter">0</span> images</p>
        </footer>
    </div>
    
    <!-- Custom confirmation modal -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confirm Download</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button id="confirmCancel" class="btn btn-secondary">Cancel</button>
                <button id="confirmOk" class="btn btn-primary">Download</button>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
